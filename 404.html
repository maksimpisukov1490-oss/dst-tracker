<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Страница не найдена — Компендиум выжившего</title>
<link rel="icon" type="image/svg+xml" href="https://maksimpisukov1490-oss.github.io/dst-tracker/assets/favicon.svg">
<style>
  html,body{height:100%}
  body{
    margin:0; display:flex; align-items:center; justify-content:center;
    background:#171310; color:#e9dbbc; font-family:Georgia,'Times New Roman',serif;
    background-image:radial-gradient(circle at 50% 20%,rgba(184,145,47,.12),transparent 55%);
  }
  main{max-width:560px; padding:32px; text-align:center}
  .mark{font-size:82px; line-height:1; color:#b8912f; margin-bottom:8px}
  h1{margin:0; font-size:clamp(30px,6vw,52px); color:#f0e2c0}
  p{margin:14px 0 26px; font-size:17px; line-height:1.55; color:#cbb894}
  a{
    display:inline-block; padding:11px 20px; border-radius:8px;
    background:linear-gradient(#6b5220,#4a3514); border:1px solid #b8912f;
    color:#fff3d4; text-decoration:none; font-size:17px;
  }
  a:hover{filter:brightness(1.15)}
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true">✦</div>
  <h1>Запись не найдена</h1>
  <p>Такой страницы в компендиуме нет. Возможно, ссылка устарела или в адресе опечатка.</p>
  <a href="https://maksimpisukov1490-oss.github.io/dst-tracker/">Вернуться в компендиум</a>
</main>
</body>
</html>
